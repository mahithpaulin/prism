name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test runner
        run: pip install pytest z3-solver
      - name: Build axiom-mcp
        run: cargo build -p axiom-mcp --manifest-path axiom/Cargo.toml
      - name: pytest
        run: python -m pytest tests/ -q
      - name: demo
        run: python examples/demo.py
      - name: eval
        run: python examples/eval_prism.py
        env:
          PRISM_AXIOM_MCP: ${{ github.workspace }}/axiom/target/debug/axiom-mcp
      - name: logic-duel
        run: python examples/logic_duel.py
        env:
          PRISM_AXIOM_MCP: ${{ github.workspace }}/axiom/target/debug/axiom-mcp
      - name: best-of-best
        run: python examples/best_of_best.py
        env:
          PRISM_AXIOM_MCP: ${{ github.workspace }}/axiom/target/debug/axiom-mcp
